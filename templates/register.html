<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Examination System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; padding: 2rem 0;">
  <div class="card shadow p-4" style="max-width: 480px; width: 100%;">
    <h3 class="card-title text-center mb-3">Student Registration</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} p-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/register">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="e.g. Rahul Verma" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" name="roll_number" class="form-control" placeholder="e.g. 102" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="student@test.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Create password" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Select Class</label>
        <select name="class_id" class="form-select" required>
          <option value="">-- Choose Class --</option>
          {% for c in classes %}
            <option value="{{ c.id }}">{{ c.class_name }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <div class="mt-3 text-center">
      <span class="text-muted small">Already have an account?</span>
      <a href="/login" class="small text-decoration-none">Log In</a>
    </div>
  </div>
</div>
</body>
</html>
