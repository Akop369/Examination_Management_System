<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Examination</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pb-5">

<!-- Fixed Top Navbar with Timer -->
<nav class="navbar navbar-dark bg-dark px-4 sticky-top d-flex justify-content-between">
  <span class="navbar-brand mb-0 h1">{{ q_set.set_title }}</span>
  <div class="d-flex align-items-center">
    <span class="text-white me-2 small">Time Remaining:</span>
    <span id="timer-badge" class="badge bg-danger fs-6">10:00</span>
  </div>
</nav>

<div class="container my-4" style="max-width: 800px;">
  <form id="examForm" method="POST" action="/exam/{{ q_set.id }}">
    <input type="hidden" name="time_taken" id="time_taken" value="0">

    {% for q in questions %}
    <div class="card shadow-sm mb-4 border-0">
      <div class="card-header bg-white fw-bold">
        Question {{ loop.index }}
      </div>
      <div class="card-body">
        <p class="fs-5 mb-3">{{ q.question_text }}</p>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_A" value="A">
          <label class="form-check-label" for="q{{ q.id }}_A">A) {{ q.option_a }}</label>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_B" value="B">
          <label class="form-check-label" for="q{{ q.id }}_B">B) {{ q.option_b }}</label>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_C" value="C">
          <label class="form-check-label" for="q{{ q.id }}_C">C) {{ q.option_c }}</label>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_D" value="D">
          <label class="form-check-label" for="q{{ q.id }}_D">D) {{ q.option_d }}</label>
        </div>
      </div>
    </div>
    {% endfor %}

    <button type="submit" class="btn btn-primary btn-lg w-100">Submit Assessment</button>
  </form>
</div>

<script>
  let timeLeft = 600; // 10 minutes default (600 seconds)
  let elapsed = 0;
  const timerBadge = document.getElementById('timer-badge');
  const timeTakenInput = document.getElementById('time_taken');
  const form = document.getElementById('examForm');

  const countdown = setInterval(function() {
    elapsed++;
    timeLeft--;
    if (timeTakenInput) {
      timeTakenInput.value = elapsed;
    }

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;
    timerBadge.innerText = 
      (minutes < 10 ? "0" + minutes : minutes) + ":" + 
      (seconds < 10 ? "0" + seconds : seconds);

    if (timeLeft <= 0) {
      clearInterval(countdown);
      alert("Time is up! Submitting your assessment.");
      form.submit();
    }
  }, 1000);
</script>

</body>
</html>
