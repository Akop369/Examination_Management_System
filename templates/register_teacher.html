<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 480px;">
    <div class="card shadow p-4 border-0">
      <h3 class="text-center fw-bold mb-3">Teacher Registration</h3>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="alert alert-{{ category }} py-2">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" required placeholder="Prof. John Doe">
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="teacher@school.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <div class="mb-3">
          <label class="form-label">Teacher Authorization Code</label>
          <input type="password" name="secret_code" class="form-control" required placeholder="Enter secret passcode">
          <div class="form-text">Requires administrative clearance code.</div>
        </div>
        <button type="submit" class="btn btn-dark w-100">Register as Teacher</button>
      </form>
    </div>
  </div>
</body>
</html>
